<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Mental Health Dataset Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #020617;
    --bg2: #0f172a;
    --bg3: #1e293b;
    --border: #1e293b;
    --border2: #334155;
    --text: #e2e8f0;
    --muted: #64748b;
    --subtle: #94a3b8;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --pink: #f472b6;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    min-height: 100vh;
    padding: 24px 20px;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* HEADER */
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  .header-icon { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px; font-size: 20px; }
  .header-title { font-size: 18px; font-weight: 700; color: #f1f5f9; }
  .header-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .header-badges { margin-left: auto; display: flex; gap: 10px; }
  .badge { background: var(--bg2); border-radius: 8px; padding: 10px 16px; text-align: center; min-width: 80px; }
  .badge-val { font-size: 20px; font-weight: 700; }
  .badge-lbl { font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }

  /* STATUS BAR */
  .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; padding: 10px 14px; background: var(--bg2); border: 1px solid #052e16; border-radius: 8px; font-size: 11px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* TABS */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab-btn { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 16px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 400; border-radius: 6px 6px 0 0; transition: all .2s; }
  .tab-btn.active { background: var(--bg3); border-bottom-color: var(--blue); color: var(--text); font-weight: 600; }
  .tab-btn:hover:not(.active) { color: var(--subtle); }

  /* PANELS */
  .panel { display: none; }
  .panel.active { display: block; }

  /* STAT CARDS */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .stat-icon { font-size: 24px; }
  .stat-val { font-size: 20px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* BAR CHARTS */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .chart-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 24px; min-height: 280px; }
  .chart-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 18px; }
  .bar-row { margin-bottom: 12px; }
  .bar-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-lbl { color: var(--subtle); }
  .bar-val { color: var(--text); font-weight: 600; }
  .bar-track { background: var(--bg3); border-radius: 5px; height: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }

  /* DONUT CHARTS */
  .donut-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .donut-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 24px; text-align: center; min-height: 340px; }
  .donut-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }
  .donut-desc { margin-top: 10px; font-size: 12px; color: var(--subtle); }
  .legend-title { margin-top: 14px; margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; }
  .donut-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px 14px; margin-top: 2px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #cbd5e1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .legend-metric { color: var(--subtle); font-size: 12px; }

  /* TABLE */
  .table-wrap { overflow: auto; max-height: 72vh; border-radius: 10px; border: 1px solid var(--border); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead tr { background: var(--bg2); }
  th { padding: 12px 16px; text-align: left; white-space: nowrap; color: var(--subtle); font-weight: 600; letter-spacing: .5px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 10; }
  tbody tr:nth-child(even) { background: #080f1f; }
  tbody tr:nth-child(odd) { background: #0a1220; }
  td { padding: 11px 16px; white-space: nowrap; border-bottom: 1px solid #0f172a; color: #cbd5e1; }
  .more-rows { margin-top: 10px; font-size: 10px; color: #475569; text-align: center; }

  /* SEARCH */
  .search-input { background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 8px 14px; font-size: 12px; width: 100%; margin-bottom: 16px; font-family: inherit; outline: none; transition: border-color .2s; }
  .search-input:focus { border-color: var(--blue); }
  .search-input::placeholder { color: var(--muted); }

  /* COLUMNS GRID */
  .col-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .col-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .col-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .col-name { font-size: 12px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-type { font-size: 10px; margin-top: 2px; }
  .col-num { font-size: 10px; color: #475569; margin-left: auto; }

  /* UPLOAD AREA */
  .upload-area { border: 2px dashed var(--border2); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: border-color .2s; margin-bottom: 20px; }
  .upload-area:hover, .upload-area.dragover { border-color: var(--blue); }
  .upload-area h3 { font-size: 14px; color: var(--subtle); margin-bottom: 8px; }
  .upload-area p { font-size: 11px; color: var(--muted); }
  .upload-btn { display: inline-block; margin-top: 12px; background: var(--blue); color: #000; padding: 8px 20px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border2); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* PROGRESS */
  .progress-wrap { margin-top: 12px; }
  .progress-bar { background: var(--bg3); border-radius: 4px; height: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width .3s; }
  .progress-txt { font-size: 10px; color: var(--muted); margin-top: 6px; }

  /* NUMERIC SUMMARY */
  .num-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .num-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 22px; }
  .num-col { font-size: 15px; font-weight: 700; color: var(--blue); margin-bottom: 12px; }
  .num-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--bg3); }
  .num-key { color: var(--muted); }
  .num-v { color: var(--text); font-weight: 600; }

  @media(max-width:1100px){
    .donut-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .num-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media(max-width:700px){
    .donut-grid { grid-template-columns: 1fr; }
    .num-grid { grid-template-columns: 1fr; }
  }

  @media(max-width:600px){
    .chart-grid { grid-template-columns: 1fr; }
    .header-badges { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🧠</div>
  <div>
    <div class="header-title" id="filename">student_mental_health_burnout.csv</div>
    <div class="header-sub" id="filestatus">Upload your CSV file to explore the dataset</div>
  </div>
  <div class="header-badges">
    <div class="badge"><div class="badge-val" id="badge-rows" style="color:#22c55e">—</div><div class="badge-lbl">ROWS</div></div>
    <div class="badge"><div class="badge-val" id="badge-cols" style="color:#60a5fa">—</div><div class="badge-lbl">COLS</div></div>
  </div>
</div>

<!-- Upload -->
<div id="upload-section">
  <div class="upload-area" id="drop-zone">
    <div style="font-size:36px;margin-bottom:12px">📂</div>
    <h3>Drop your CSV file here</h3>
    <p>or click the button below to browse</p>
    <label><input type="file" id="file-input" accept=".csv" style="display:none"><span class="upload-btn">Choose CSV File</span></label>
    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-txt" id="progress-txt">Reading file...</div>
    </div>
  </div>
</div>

<!-- Main App (hidden until file loaded) -->
<div id="app" style="display:none">
  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="status-text">Dataset loaded successfully</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('overview', this)">📊 Overview</button>
    <button class="tab-btn" onclick="switchTab('distribution', this)">🥧 Distribution</button>
    <button class="tab-btn" onclick="switchTab('preview', this)">🔍 Data Preview</button>
    <button class="tab-btn" onclick="switchTab('numeric', this)">📈 Numeric Stats</button>
    <button class="tab-btn" onclick="switchTab('columns', this)">📋 Columns</button>
  </div>

  <!-- OVERVIEW -->
  <div id="panel-overview" class="panel active">
    <div class="stat-grid" id="stat-grid"></div>
    <div class="chart-grid" id="chart-grid"></div>
  </div>

  <!-- DISTRIBUTION -->
  <div id="panel-distribution" class="panel">
    <div class="donut-grid" id="donut-grid"></div>
  </div>

  <!-- PREVIEW -->
  <div id="panel-preview" class="panel">
    <div style="font-size:13px;color:var(--subtle);margin-bottom:12px" id="preview-hint"></div>
    <div class="table-wrap"><table id="preview-table"></table></div>
    <div class="more-rows" id="more-rows-txt"></div>
  </div>

  <!-- NUMERIC STATS -->
  <div id="panel-numeric" class="panel">
    <div class="num-grid" id="num-grid"></div>
  </div>

  <!-- COLUMNS -->
  <div id="panel-columns" class="panel">
    <input class="search-input" id="col-search" placeholder="🔍  Search columns..." oninput="filterCols()" />
    <div class="col-grid" id="col-grid"></div>
  </div>
</div>

<script>
let DS = { rows: [], headers: [], types: {}, categoricals: {}, numerics: {} };

const COLORS = {
  High:"#ef4444",Medium:"#f59e0b",Low:"#22c55e",
  Male:"#60a5fa",Female:"#f472b6",Other:"#a78bfa",
  Good:"#22c55e",Average:"#f59e0b",Poor:"#ef4444",
  BTech:"#3b82f6",BCA:"#8b5cf6",BSc:"#06b6d4",
  MBA:"#f97316",MCA:"#ec4899",BBA:"#84cc16",
  "1st":"#60a5fa","2nd":"#818cf8","3rd":"#a78bfa","4th":"#c084fc"
};
const PALETTE = ["#60a5fa","#a78bfa","#f472b6","#f59e0b","#22c55e","#06b6d4","#f97316","#84cc16","#ec4899","#14b8a6"];

// ── FILE HANDLING ──────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

function loadFile(file) {
  if (!file || !file.name.endsWith('.csv')) return alert('Please select a CSV file.');
  document.getElementById('filename').textContent = file.name;
  document.getElementById('filestatus').textContent = 'Reading file...';
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-txt').textContent = 'Reading file...';
  const reader = new FileReader();
  reader.onprogress = e => {
    if (e.lengthComputable) {
      const pct = Math.round(e.loaded / e.total * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-txt').textContent = `Reading... ${pct}%`;
    }
  };
  reader.onload = e => {
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('progress-txt').textContent = 'File read complete. Finalizing data...';
    parseCSV(e.target.result, file.name);
  };
  reader.readAsText(file);
}

function parseCSV(text, filename) {
  document.getElementById('progress-txt').textContent = 'Parsing data...';
  setTimeout(() => {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = splitCSVLine(lines[i]);
      if (vals.length !== headers.length) continue;
      const row = {};
      headers.forEach((h, j) => row[h] = vals[j]);
      rows.push(row);
    }
    DS.headers = headers;
    DS.rows = rows;
    analyzeData();
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('progress-txt').textContent = 'Preparing dashboard...';
    setTimeout(() => renderAll(filename), 2000);
  }, 250);
}

function splitCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let c of line) {
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  result.push(cur.trim());
  return result;
}

function analyzeData() {
  const types = {}, cats = {}, nums = {};
  DS.headers.forEach(h => {
    let isNum = true;
    const vals = DS.rows.map(r => r[h]);
    for (let v of vals.slice(0,200)) {
      if (isNaN(parseFloat(v)) || v.trim() === '') { isNum = false; break; }
    }
    types[h] = isNum ? 'numeric' : (h === DS.headers[0] ? 'id' : 'categorical');
    if (!isNum && h !== DS.headers[0]) {
      const counts = {};
      vals.forEach(v => { v = v.trim(); counts[v] = (counts[v]||0)+1; });
      cats[h] = counts;
    }
    if (isNum) {
      const numVals = vals.map(v => parseFloat(v)).filter(v => !isNaN(v));
      numVals.sort((a,b) => a-b);
      const sum = numVals.reduce((a,b)=>a+b,0);
      const mean = sum/numVals.length;
      const med = numVals[Math.floor(numVals.length/2)];
      const std = Math.sqrt(numVals.reduce((a,b)=>a+(b-mean)**2,0)/numVals.length);
      nums[h] = {
        min: numVals[0], max: numVals[numVals.length-1],
        mean: mean.toFixed(2), median: med.toFixed(2),
        std: std.toFixed(2), count: numVals.length
      };
    }
  });
  DS.types = types; DS.categoricals = cats; DS.numerics = nums;
}

// ── RENDER ─────────────────────────────────────────────
function renderAll(filename) {
  document.getElementById('upload-section').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('filestatus').textContent = 'Dataset loaded successfully';
  document.getElementById('badge-rows').textContent = DS.rows.length.toLocaleString();
  document.getElementById('badge-cols').textContent = DS.headers.length;
  document.getElementById('status-text').textContent = `${filename} · ${DS.rows.length.toLocaleString()} rows · ${DS.headers.length} columns`;

  renderOverview();
  renderDistribution();
  renderPreview();
  renderNumeric();
  renderColumns();
}

// OVERVIEW
function renderOverview() {
  const numericCount = Object.values(DS.types).filter(t=>t==='numeric').length;
  const catCount = Object.values(DS.types).filter(t=>t==='categorical').length;
  const sg = document.getElementById('stat-grid');
  sg.innerHTML = [
    { label:'Total Records', val: DS.rows.length.toLocaleString(), icon:'👨‍🎓', color:'#60a5fa' },
    { label:'Total Columns', val: DS.headers.length, icon:'📋', color:'#a78bfa' },
    { label:'Numeric Columns', val: numericCount, icon:'🔢', color:'#22c55e' },
    { label:'Categorical Cols', val: catCount, icon:'🏷️', color:'#f59e0b' },
  ].map(c=>`<div class="stat-card"><div class="stat-icon">${c.icon}</div><div><div class="stat-val" style="color:${c.color}">${c.val}</div><div class="stat-lbl">${c.label}</div></div></div>`).join('');

  // bar charts for top categoricals
  const cg = document.getElementById('chart-grid');
  const catKeys = Object.keys(DS.categoricals).slice(0,4);
  cg.innerHTML = catKeys.map(k => {
    const data = DS.categoricals[k];
    const maxVal = Math.max(...Object.values(data));
    const bars = Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([lbl,v],i)=>`
      <div class="bar-row">
        <div class="bar-meta"><span class="bar-lbl">${lbl}</span><span class="bar-val">${v.toLocaleString()}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(v/maxVal*100).toFixed(1)}%;background:${COLORS[lbl]||PALETTE[i%PALETTE.length]}"></div></div>
      </div>`).join('');
    return `<div class="chart-box"><div class="chart-title">${k.replace(/_/g,' ')}</div>${bars}</div>`;
  }).join('');
}

// DISTRIBUTION (donuts via SVG)
function renderDistribution() {
  const dg = document.getElementById('donut-grid');
  dg.innerHTML = Object.entries(DS.categoricals).map(([key, data]) => {
    const total = Object.values(data).reduce((a,b)=>a+b,0);
    const entries = Object.entries(data).sort((a,b)=>b[1]-a[1]);
    const topEntry = entries[0] || ['N/A', 0];
    let cum = 0;
    const paths = entries.map(([lbl,v],i) => {
      const pct = v/total; const start = cum; cum += pct;
      const color = COLORS[lbl] || PALETTE[i%PALETTE.length];
      return `<path d="${arc(start, start+pct)}" fill="${color}" stroke="#0f172a" stroke-width="1"/>`;
    }).join('');
    const legend = entries.map(([lbl,v],i) => {
      const color = COLORS[lbl]||PALETTE[i%PALETTE.length];
      return `<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${lbl} <span class="legend-metric">${v.toLocaleString()} (${(v/total*100).toFixed(0)}%)</span></div>`;
    }).join('');
    return `<div class="donut-box">
      <div class="donut-title">${key.replace(/_/g,' ')}</div>
      <svg viewBox="0 0 100 100" style="width:160px;height:160px;display:block;margin:0 auto">
        ${paths}
        <circle cx="50" cy="50" r="22" fill="#0f172a"/>
        <text x="50" y="56" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold" font-family="monospace">${entries.length}</text>
        <text x="50" y="44" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">types</text>
      </svg>
      <div class="donut-desc">Total: ${total.toLocaleString()} records · Top: ${topEntry[0]} (${((topEntry[1] / total) * 100 || 0).toFixed(1)}%)</div>
      <div class="legend-title">Legend</div>
      <div class="donut-legend">${legend}</div>
    </div>`;
  }).join('');
}

function arc(start, end) {
  const r=40,cx=50,cy=50;
  const s = start*2*Math.PI - Math.PI/2, e = end*2*Math.PI - Math.PI/2;
  const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
  const large = end-start>0.5?1:0;
  return `M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2}Z`;
}

// PREVIEW
function renderPreview() {
  const maxPreviewRows = 500;
  const previewRows = DS.rows.slice(0, maxPreviewRows);
  document.getElementById('preview-hint').textContent =
    `Showing ${previewRows.length.toLocaleString()} of ${DS.rows.length.toLocaleString()} rows`;
  const thead = `<thead><tr>${DS.headers.map(h=>`<th><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${DS.types[h]==='numeric'?'#60a5fa':DS.types[h]==='categorical'?'#a78bfa':'#f59e0b'};margin-right:5px;vertical-align:middle"></span>${h}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${previewRows.map(row=>`<tr>${DS.headers.map(h=>{
    const v=row[h]||''; const color = COLORS[v]||'';
    return `<td style="${color?`color:${color};font-weight:600`:''}">  ${v}</td>`;
  }).join('')}</tr>`).join('')}</tbody>`;
  document.getElementById('preview-table').innerHTML = thead+tbody;
  document.getElementById('more-rows-txt').textContent =
    DS.rows.length > maxPreviewRows
      ? `Preview is limited to ${maxPreviewRows.toLocaleString()} rows for smoother performance.`
      : '';
}

// NUMERIC STATS
function renderNumeric() {
  const ng = document.getElementById('num-grid');
  ng.innerHTML = Object.entries(DS.numerics).map(([col, s]) => `
    <div class="num-card">
      <div class="num-col">${col}</div>
      ${[['min',s.min],['max',s.max],['mean',s.mean],['median',s.median],['std dev',s.std],['count',Number(s.count).toLocaleString()]].map(([k,v])=>`
        <div class="num-row"><span class="num-key">${k}</span><span class="num-v">${v}</span></div>`).join('')}
    </div>`).join('');
}

// COLUMNS
let allColCards = [];
function renderColumns() {
  const cg = document.getElementById('col-grid');
  const typeColor = { numeric:'#60a5fa', categorical:'#a78bfa', id:'#f59e0b' };
  const typeLabel = { numeric:'#', categorical:'≡', id:'ID' };
  allColCards = DS.headers.map((col,i) => {
    const t = DS.types[col]||'categorical';
    return `<div class="col-card" data-col="${col.toLowerCase()}">
      <div class="col-icon" style="background:${typeColor[t]}22;color:${typeColor[t]}">${typeLabel[t]}</div>
      <div style="flex:1;min-width:0">
        <div class="col-name">${col}</div>
        <div class="col-type" style="color:${typeColor[t]}">${t}</div>
      </div>
      <div class="col-num">#${i+1}</div>
    </div>`;
  });
  cg.innerHTML = allColCards.join('');
}

function filterCols() {
  const q = document.getElementById('col-search').value.toLowerCase();
  const filtered = DS.headers.filter(h => h.toLowerCase().includes(q));
  const cg = document.getElementById('col-grid');
  const typeColor = { numeric:'#60a5fa', categorical:'#a78bfa', id:'#f59e0b' };
  const typeLabel = { numeric:'#', categorical:'≡', id:'ID' };
  cg.innerHTML = filtered.map((col,i) => {
    const t = DS.types[col]||'categorical';
    return `<div class="col-card">
      <div class="col-icon" style="background:${typeColor[t]}22;color:${typeColor[t]}">${typeLabel[t]}</div>
      <div style="flex:1;min-width:0">
        <div class="col-name">${col}</div>
        <div class="col-type" style="color:${typeColor[t]}">${t}</div>
      </div>
      <div class="col-num">#${DS.headers.indexOf(col)+1}</div>
    </div>`;
  }).join('');
}

// TABS
function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const activeButton = btn || document.querySelector(`.tab-btn[onclick*="'${id}'"]`);
  if (activeButton) activeButton.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
}
</script>
</body>
</html>
